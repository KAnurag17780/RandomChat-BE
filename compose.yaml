services:
  postgres:
    image: postgres:16-alpine
    container_name: randomchat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-randomchat}
      POSTGRES_USER: ${POSTGRES_USER:-randomchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-randomchat} -d ${POSTGRES_DB:-randomchat}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
